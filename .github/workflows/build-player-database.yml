name: Build cricket player database
# Rebuilds the game player database whenever the generator changes.

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_players.py"
      - ".github/workflows/build-player-database.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build database from Cricsheet
        run: python scripts/build_players.py
      - name: Commit generated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add players.js
          if git diff --cached --quiet; then
            echo "No database changes."
          else
            git commit -m "Auto-build comprehensive cricket player database"
            git push
          fi
